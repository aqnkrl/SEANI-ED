{% extends 'base_admin.html' %}
{% load static %}

{% block title %}Análisis Predictivo: {{ modelo }}{% endblock %}

{% block content %}
<h1 class="bienvenida">Análisis de Ecuación Diferencial: {{ modelo }}</h1>

<div class="formulario-center">
    <form method="get" class="formulario formulario--left" style="display: flex; gap: 1.5rem; align-items: flex-end; flex-wrap: wrap;">
        <div style="flex: 1;">
            <label for="year">Año:</label>
        <select name="year" id="year" class="campo-input">
                <option value="">Todos</option>
                {% for y in years %}
                    <option value="{{ y.year }}" {% if y.year|stringformat:"s" == selected_year|stringformat:"s" %}selected{% endif %}>{{ y.year }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="flex: 1;">
            <label for="stage">Etapa:</label>
            <select name="stage" id="stage" class="campo-input">
                <option value="">Todas</option>
                {% for stg in stages %}
                    <option value="{{ stg }}" {% if stg|stringformat:"s" == selected_stage|stringformat:"s" %}selected{% endif %}>Etapa {{ stg }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="flex: 1;">
            <label for="career">Carrera:</label>
            <select name="career" id="career" class="campo-input">
                <option value="">Todas</option>
                {% for c in careers %}
                    <option value="{{ c.id }}" {% if c.id|stringformat:"s" == selected_career|stringformat:"s" %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <button type="submit" class="guardar">Filtrar</button>
        </div>
    </form>
</div>

<div class="table-wrapper" style="margin-top: 2rem; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    <canvas id="chartPredictivo" height="110"></canvas>
</div>

{{ chart_labels|json_script:"labels-json" }}
{{ chart_data|json_script:"datasets-json" }}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const labels = JSON.parse(document.getElementById('labels-json').textContent);
    let datasets = JSON.parse(document.getElementById('datasets-json').textContent);

    // Ajustamos visualmente los datasets para que no sean barras amontonadas
    datasets = datasets.map(ds => {
        if (ds.type === 'line') {
            // Estilo para la línea de Predicción Matemática
            return {
                ...ds,
                borderWidth: 4,
                pointRadius: 5,
                pointHoverRadius: 8,
                zIndex: 10 // Que siempre esté arriba
            };
        } else {
            // Convertimos las barras de carreras en líneas suaves
            return {
                ...ds,
                type: 'line',
                fill: false,
                borderColor: ds.backgroundColor, // Usamos el mismo color que tenía la barra
                borderWidth: 2,
                tension: 0.3,
                pointRadius: 3
            };
        }
    });
const ctx = document.getElementById('chartPredictivo').getContext('2d');
    new Chart(ctx, {
        type: 'line', 
        data: {
            labels: labels,
            datasets: datasets
        },
        options: {
            responsive: true,
            // --- AGREGAR ESTO PARA FORZAR CURVAS ---
            elements: {
                line: {
                    tension: 0.4 // Esto suaviza todas las líneas (0.0 es recto, 0.4 es curvo)
                }
            },
            interaction: {
                mode: 'index',
                intersect: false
            },
            plugins: {
                title: {
                    display: true,
                    text: 'Tendencia Real por Carrera vs. Modelo Matemático ({{ modelo }})',
                    font: { size: 16 }
                },
                legend: {
                    position: 'bottom',
                    labels: { usePointStyle: true, padding: 20 }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    max: 10,
                    title: { display: true, text: 'Calificación (0-10)', font: { weight: 'bold' } },
                    grid: { color: '#f0f0f0' }
                },
                x: {
                    title: { display: true, text: 'Progreso por Etapas', font: { weight: 'bold' } },
                    grid: { display: false }
                }
            }
        }
    });
</script>
{% endblock %}
