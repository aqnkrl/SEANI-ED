{% extends 'base_admin.html' %}

{% block title %}Eliminar Etapa{% endblock %}

{% block content %}
<h1 class="bienvenida">Eliminar Etapa</h1>

<div class="eliminar-contenedor">
    <p>
        ¿Estás seguro de que deseas eliminar la etapa 
        <strong>{{ stage.stage }}</strong> con fecha de aplicación 
        <strong>{{ stage.application_date|date:"d/m/Y" }}</strong>?
    </p>

    <form method="post" class="eliminar-formulario">
        {% csrf_token %}
        <button type="submit" class="btn-eliminar">Eliminar</button>
        <a href="{% url 'exam:stage_list' %}" class="btn-cancelar">Cancelar</a>
    </form>
</div>
{% endblock %}
