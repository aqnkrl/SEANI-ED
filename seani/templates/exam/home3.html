{% extends 'base.html' %}

{% block title %}Home Aspirante{% endblock %}

{% block content %}
{% load static %}
<h1>{{ user.exam.full_name }} - {{ user.exam.career }}</h1>
<hr>
<img src="{% static 'images/mascotaUtt.png' %}" alt="Logo UTT" class="guerrero">

<h2 class="welcome">Espera Resultados en las cuentas oficiales de la Universidad</h2>
<hr>
<form action="{% url 'exam:logout' %}" method="post">
    {% csrf_token %}
    <input type="submit" value="Salir" class="exit">
</form>
{% endblock %}
