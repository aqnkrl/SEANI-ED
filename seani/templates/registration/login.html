{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<h1>SEANI 2024</h1>

{% if form.errors %}
<p class="error">Usuario o Contraseña Incorrectos</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.username.label }}<br>
    {{ form.username }}<br>
    {{ form.password.label }}<br>
    {{ form.password }}<br>
    <input type="submit" value="Ingresar">
</form>

{% endblock %}
